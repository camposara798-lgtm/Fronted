</head>

            <h2>Minecraft</h2>

            <button class="boton">Ver videojuego</button>
        </div>

        <div class="videojuego destacado">
            <h2>Fortnite</h2>
            <p class="genero">Battle Royale</p>

        </div>

        <div class="videojuego">
            <h2>FIFA 25</h2>
            <p class="genero">Deportes</p>
            <button class="boton">Ver videojuego</button>
        </div>
    </section>
    <script src="index.js"></script>
</body>
</html>
