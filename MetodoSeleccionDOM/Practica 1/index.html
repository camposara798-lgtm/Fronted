<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de experimentación DOM</title>
</head>
<body>

    <h1 id="tituloPrincipal">Laboratorio de experimentación</h1>

    <h2>Experimentos con selectores</h2>

    <!-- Varios párrafos -->
    <p class="texto">Este es el primer párrafo.</p>
    <p class="texto">Este es el segundo párrafo.</p>
    <p class="texto destacado">Este es el tercer párrafo.</p>

    <!-- Varias imágenes -->
    <img class="imagen" src="img/Imagen 1.jpg" alt="Imagen 1">
    <img class="imagen" src="img/Imagen 2.jpg" alt="Imagen 2">

    <!-- Varios botones -->
    <button class="boton">Botón 1</button>
    <button class="boton">Botón 2</button>
    <button class="boton especial">Botón 3</button>

    <!-- Elementos con diferentes clases -->
    <div class="caja">Caja 1</div>
    <div class="caja">Caja 2</div>
    <div class="caja especial">Caja 3</div>

    <!-- Elementos con diferentes identificadores -->
    <p id="parrafoEspecial">Este párrafo tiene un identificador.</p>
    <button id="botonEspecial">Botón con identificador</button>

    <script src="index.js"></script>
</body>
</html>
