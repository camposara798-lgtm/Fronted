<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento Onkeydown</title>
</head>
<body>
    <H1>Captura de profesion</H1>
    <label for="profesion">Escribe tu profesion:</label>
    <input type="text" id="profesion" onkeydown="capturarTecla()" placeholder="Ejemplo registrado">
    <h1>Capturar contenido</h1>
    <p id="resultado"></p>
    <script src="onkeydown.js"></script>
</body>
</html>
