<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento onchange</title>
</head>
<body>
    <h2>Programa formación</h2>

    <label for="programa">Seleccione un programa</label>

    <select id="programa" onchange="mostrarPrograma()">
        <option value="">--Seleccione--</option>
        <option value="Analisis y Desarrollo de software">Analisis y Desarrollo de software</option>
        <option value="programacion de software">Programacion de software</option>
        <option value="Desarrollo de videojuegos">Desarrollo de videojuegos</option>
        <option value="diseño grafico">Diseño grafico</option>
        <option value="redes y telecomunicaciones">Redes y telecomunicaciones</option>
    </select>

    <h3 id="resultado"></h3>

    <script src="index.js"></script>
</body>
</html>
