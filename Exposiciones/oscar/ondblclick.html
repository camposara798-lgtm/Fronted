<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad de ondblclick</title>
</head>
<body>

    <input type="text" id="actividad">

    <p id="resultado"></p>

    <script src="ondblclick.js"></script>
</body>
</html>
