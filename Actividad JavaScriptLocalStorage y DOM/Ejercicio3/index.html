<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Catálogo de animales</h1>

    <form id="formularioAnimal">
        <label>Nombre:</label>
        <input type="text" id="nombre">
        <label>Especie:</label>
        <input type="text" id="especie">
        <label>Edad:</label>
        <input type="number" id="edad">
        <label>Hábitat:</label>
        <input type="text" id="habitat">
        <label>URL de imagen:</label>
        <input type="url" id="imagen">
        <button type="submit">Agregar animal</button>
    </form>
    <br>
    <button id="mostrarAnimales">Mostrar animales</button>
    <div id="contenedorAnimales"></div>

    <script src="index.js"></script>
</body>
</html>
